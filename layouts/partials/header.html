<header class="border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 transition-colors">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <a href="{{ "/" | relURL }}" class="flex items-center gap-2.5 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center shadow-md shadow-red-500/20 group-hover:scale-105 transition-transform">
        <svg class="w-5 h-5 fill-white ml-0.5" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">
        YT <span class="text-red-600 dark:text-red-500">Thumbnail</span>
      </span>
    </a>

    <div class="flex items-center gap-4 sm:gap-6">
      <nav class="hidden sm:flex items-center gap-6 text-sm font-semibold text-slate-600 dark:text-slate-300">
        <a href="{{ "/" | relURL }}" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">Home</a>
        <a href="{{ "about/" | relURL }}" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">About</a>
        <a href="{{ "blog/" | relURL }}" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">Blog</a>
        <a href="{{ "privacy-policy/" | relURL }}" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">Privacy</a>
      </nav>

      <!-- Dark Mode Toggle Button -->
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
        class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-slate-700 transition-all focus:outline-none focus:ring-2 focus:ring-red-500">
        <!-- Sun Icon (shown in dark mode) -->
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
