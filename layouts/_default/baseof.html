<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}" class="h-full">
<head>
  {{ partial "head.html" . }}
</head>
<body class="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
  {{ partial "header.html" . }}
  <main class="flex-grow">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/app.js" | relURL }}"></script>
</body>
</html>
